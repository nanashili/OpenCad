name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            os: macos-15
            target: aarch64-apple-darwin
            python: python3
          - label: macOS x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            python: python3
          - label: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            python: python
          - label: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            python: python3
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      OPENCAD_TARGET: ${{ matrix.target }}
      PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libwayland-dev libxkbcommon-dev
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Check formatting
        run: cargo fmt --check
      - name: Reproduce original UI assets
        if: runner.os == 'Linux'
        run: |
          "$PYTHON" scripts/generate-icons.py
          "$PYTHON" scripts/generate-ui-catalog.py
          cargo fmt
          git diff --exit-code -- assets src/desktop/catalog.rs
      - name: Test
        run: cargo test --locked --all-features
      - name: Lint
        run: cargo clippy --locked --all-features --all-targets -- -D warnings
      - name: Build GUI and CLI
        run: cargo build --locked --release --features desktop --bins --target "$OPENCAD_TARGET"
      - name: Smoke test packaged CLI
        run: |
          "$PYTHON" - <<'PY'
          import os, pathlib, subprocess, sys, tempfile
          suffix = '.exe' if sys.platform == 'win32' else ''
          executable = pathlib.Path('target') / os.environ['OPENCAD_TARGET'] / 'release' / ('opencad' + suffix)
          subprocess.run([str(executable), '--help'], check=True)
          with tempfile.TemporaryDirectory() as directory:
              output = pathlib.Path(directory) / 'courtyard.dxf'
              subprocess.run([str(executable), 'dxf-copy', 'examples/courtyard.dxf', str(output)], check=True)
              assert output.read_bytes() == pathlib.Path('examples/courtyard.dxf').read_bytes()
          PY
      - name: Package release artifacts
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [[ "$REF_TYPE" == "tag" ]]; then
            version="$REF_NAME"
          else
            version="0.1.0-dev.$RUN_NUMBER"
          fi
          "$PYTHON" scripts/dependency-notices.py --target "$OPENCAD_TARGET"
          "$PYTHON" scripts/package-release.py --target "$OPENCAD_TARGET" --version "$version" --binary-dir "target/$OPENCAD_TARGET/release"
      - name: Upload platform archives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OpenCad-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: OpenCad-*
          path: dist
          merge-multiple: true
      - name: Verify and publish archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          cd dist
          cat ./*.sha256 > SHA256SUMS.txt
          test "$(wc -l < SHA256SUMS.txt)" -eq 4
          sha256sum --check SHA256SUMS.txt
          cat > release-notes.md <<'NOTES'
          OpenCad is an AutoCAD reverse engineering project with an independent clean-room implementation in Rust. This early release supports a limited R12 ASCII DXF workflow; DWG and full AutoCAD feature parity are not implemented.

          Packages include the GUI, CLI, examples, documentation, MIT license and dependency notices. Choose macOS arm64 (Apple Silicon), macOS x64 (Intel), Windows x64, or Linux x64. SHA256SUMS.txt verifies the four archives.

          macOS bundles are ad hoc signed and are not notarized. Windows binaries are unsigned. Linux packages require a desktop with OpenGL, X11 or Wayland, and Ubuntu 22.04 compatible system libraries. See the README for installation and current limitations.
          NOTES
          prerelease=()
          if [[ "$RELEASE_TAG" == *-* ]]; then prerelease=(--prerelease); fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" ./*.zip ./*.tar.gz SHA256SUMS.txt --clobber
          else
            gh release create "$RELEASE_TAG" ./*.zip ./*.tar.gz SHA256SUMS.txt --verify-tag --title "OpenCad $RELEASE_TAG" --notes-file release-notes.md "${prerelease[@]}"
          fi
