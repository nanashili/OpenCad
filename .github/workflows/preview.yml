name: Preview artifacts

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event.inputs.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            os: macos-15
            target: aarch64-apple-darwin
            python: python3
          - label: macOS x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            python: python3
          - label: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            python: python
          - label: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            python: python3
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      OPENCAD_TARGET: ${{ matrix.target }}
      PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libwayland-dev libxkbcommon-dev
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Build GUI and CLI
        run: cargo build --locked --release --features desktop --bins --target "$OPENCAD_TARGET"
      - name: Smoke test packaged CLI
        run: |
          "$PYTHON" - <<'PY'
          import os
          import pathlib
          import subprocess
          import sys
          import tempfile

          def require_nonempty(path):
              if path.stat().st_size == 0:
                  raise RuntimeError(f'Expected non-empty output: {path}')

          def smoke_dxf_copy(executable, directory):
              source = pathlib.Path('examples/courtyard.dxf').resolve()
              first = directory / 'courtyard-first.dxf'
              second = directory / 'courtyard-second.dxf'
              third = directory / 'courtyard-third.dxf'
              subprocess.run([str(executable), 'dxf-copy', str(source), str(first)], check=True)
              subprocess.run([str(executable), 'dxf-copy', str(first), str(second)], check=True)
              subprocess.run([str(executable), 'dxf-copy', str(second), str(third)], check=True)
              for output in (first, second, third):
                  require_nonempty(output)
              if second.read_bytes() != third.read_bytes():
                  raise RuntimeError('Repeated DXF copy changed the serialized document.')

          def smoke_script_reopen(executable, directory):
              script = directory / 'preview.scr'
              scripted = directory / 'scripted.dxf'
              reopened = directory / 'scripted-reopened.dxf'
              script.write_text(
                  'LINE 0,0 10,0\nTEXT 0,2 1 Preview\nFIELD CREATE Count entitycount 1 2\n',
                  encoding='utf-8',
                  newline='\n',
              )
              subprocess.run([str(executable), 'run-script', str(script), str(scripted)], check=True)
              subprocess.run([str(executable), 'dxf-copy', str(scripted), str(reopened)], check=True)
              for output in (scripted, reopened):
                  require_nonempty(output)

          def main():
              suffix = '.exe' if sys.platform == 'win32' else ''
              executable = pathlib.Path('target') / os.environ['OPENCAD_TARGET'] / 'release' / ('opencad' + suffix)
              subprocess.run([str(executable), '--help'], check=True)
              with tempfile.TemporaryDirectory() as temporary_directory:
                  directory = pathlib.Path(temporary_directory)
                  smoke_dxf_copy(executable, directory)
                  smoke_script_reopen(executable, directory)

          main()
          PY
      - name: Package preview artifacts
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          version="0.1.0-preview.${RUN_NUMBER}"
          "$PYTHON" scripts/dependency-notices.py --target "$OPENCAD_TARGET"
          "$PYTHON" scripts/package-release.py --target "$OPENCAD_TARGET" --version "$version" --binary-dir "target/$OPENCAD_TARGET/release"
      - name: Upload preview archives and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OpenCad-preview-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30
